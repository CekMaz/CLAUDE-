<!doctype html>
<html
  lang="ms"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"accent","type":"color","label":"Accent","default":"#FFD23F"},
    {"id":"hot","type":"color","label":"Hot","default":"#FF3B3B"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --accent: #ffd23f;
        --hot: #ff3b3b;
        --ink: #0b0b0f;
        --paper: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      /* camera rig: #cam = zoom/reframe, #shake = impact jitter */
      #cam,
      #shake {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      .plate {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
        z-index: 40;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10.33"
      data-width="1080"
      data-height="1920"
    >
      <div id="cam">
        <div id="shake">
          <!-- ===== EDIT: footage segments (dead air, awkward pauses and the "dah" outtake removed) ===== -->
          <!-- A: src 3.95–7.42  "tepi tepi tepi… ok… guys" -->
          <video id="segA" class="clip plate" src="assets/footage.mp4" playsinline data-has-audio="true"
            data-start="0" data-duration="3.47" data-media-start="3.95" data-fade-in="0.02" data-fade-out="0.03"
            data-track-index="0" style="z-index: 1"></video>
          <!-- B: src 8.08–9.38  "korang nak tahu tak, tahun depan" (0.66 s pause cut) -->
          <video id="segB" class="clip plate" src="assets/footage.mp4" playsinline data-has-audio="true"
            data-start="3.47" data-duration="1.30" data-media-start="8.08" data-fade-in="0.03" data-fade-out="0.03"
            data-track-index="0" style="z-index: 1"></video>
          <!-- C: src 10.15–11.70  "medical card banyak perubahan" (0.77 s pause cut) -->
          <video id="segC" class="clip plate" src="assets/footage.mp4" playsinline data-has-audio="true"
            data-start="4.77" data-duration="1.55" data-media-start="10.15" data-fade-in="0.03" data-fade-out="0.03"
            data-track-index="0" style="z-index: 1"></video>
          <!-- D: src 12.28–13.62  "pada tahun 2027" (0.58 s pause cut) -->
          <video id="segD" class="clip plate" src="assets/footage.mp4" playsinline data-has-audio="true"
            data-start="6.32" data-duration="1.34" data-media-start="12.28" data-fade-in="0.03" data-fade-out="0.04"
            data-track-index="0" style="z-index: 1"></video>
          <!-- E: src 13.62–14.85 at 0.46x, silent outro under the CTA ("dah" at 14.9 dropped) -->
          <video id="segE" class="clip plate" src="assets/footage.mp4" playsinline muted
            data-start="7.66" data-duration="2.67" data-media-start="13.62" data-playback-rate="0.46"
            data-track-index="0" style="z-index: 1"></video>

          <!-- giant 2027 (z above the matte, chest height) + back half of the card orbit -->
          <div id="year" class="layer" data-composition-id="year" data-composition-src="compositions/year.html"
            data-start="6.32" data-duration="1.40" data-width="1080" data-height="1920"
            data-track-index="1" data-track-kind="graphics" style="z-index: 6"></div>
          <div id="orbit-back" class="layer" data-composition-id="orbit-back" data-composition-src="compositions/orbit-back.html"
            data-start="4.77" data-duration="1.55" data-width="1080" data-height="1920"
            data-track-index="2" data-track-kind="graphics" style="z-index: 3"></div>

          <!-- matte of the speaker (src 10.0–13.7) so graphics can pass behind him -->
          <video id="cutC" class="clip plate" src="assets/cutout-cd.webm" playsinline muted
            data-start="4.77" data-duration="1.55" data-media-start="0.15" data-layout-allow-occlusion
            data-track-index="3" style="z-index: 4"></video>
          <video id="cutD" class="clip plate" src="assets/cutout-cd.webm" playsinline muted
            data-start="6.32" data-duration="1.34" data-media-start="2.28" data-layout-allow-occlusion
            data-track-index="3" style="z-index: 4"></video>

          <!-- in front of the speaker: front half of the card orbit -->
          <div id="orbit-front" class="layer" data-composition-id="orbit-front" data-composition-src="compositions/orbit-front.html"
            data-start="4.77" data-duration="1.55" data-width="1080" data-height="1920"
            data-track-index="4" data-track-kind="graphics" style="z-index: 5"></div>
        </div>
      </div>

      <!-- ===== overlays (outside the camera rig, so they stay put) ===== -->
      <div id="dzoom" class="layer" data-composition-id="dzoom" data-composition-src="compositions/dzoom.html"
        data-start="2.62" data-duration="0.85" data-width="1080" data-height="1920"
        data-track-index="5" data-track-kind="graphics" style="z-index: 8"></div>
      <div id="clonewall" class="layer" data-composition-id="clonewall" data-composition-src="compositions/clonewall.html"
        data-start="3.47" data-duration="0.98" data-width="1080" data-height="1920"
        data-track-index="5" data-track-kind="graphics" style="z-index: 10"></div>
      <div id="chips" class="layer" data-composition-id="chips" data-composition-src="compositions/chips.html"
        data-start="5.36" data-duration="0.96" data-width="1080" data-height="1920"
        data-track-index="5" data-track-kind="graphics" style="z-index: 12"></div>
      <div id="hook" class="layer" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="3.47" data-width="1080" data-height="1920"
        data-track-index="6" data-track-kind="graphics" style="z-index: 20"></div>
      <div id="cta" class="layer" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="7.62" data-duration="2.71" data-width="1080" data-height="1920"
        data-track-index="6" data-track-kind="graphics" style="z-index: 22"></div>
      <div id="captions" class="layer" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="6.32" data-width="1080" data-height="1920"
        data-track-index="7" data-track-kind="captions" style="z-index: 30"></div>
      <div id="flash" class="clip" data-start="6.74" data-duration="0.22" data-track-index="8"
        data-layout-ignore></div>

      <!-- ===== SFX (start = hit + 1 frame − measured peak) ===== -->
      <audio id="sfx-hook" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0" data-duration="1.6" data-volume="0.32" data-fade-out="0.4" data-track-index="9"></audio>
      <audio id="sfx-wall-out" class="clip" src="assets/sfx/whoosh.mp3" data-start="0.83" data-duration="0.57" data-volume="0.45" data-track-index="10"></audio>
      <audio id="sfx-zoom1" class="clip" src="assets/sfx/click.mp3" data-start="2.69" data-duration="0.37" data-volume="0.55" data-track-index="9"></audio>
      <audio id="sfx-zoom2" class="clip" src="assets/sfx/click-soft.mp3" data-start="2.97" data-duration="0.37" data-volume="0.65" data-track-index="10"></audio>
      <audio id="sfx-cut-wall" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="3.37" data-duration="0.5" data-volume="0.4" data-track-index="10"></audio>
      <audio id="sfx-glitch" class="clip" src="assets/sfx/glitch-3.mp3" data-start="3.45" data-duration="0.55" data-media-start="0.2" data-volume="0.22" data-fade-out="0.15" data-track-index="9"></audio>
      <audio id="sfx-wall-merge" class="clip" src="assets/sfx/whoosh.mp3" data-start="3.98" data-duration="0.57" data-volume="0.35" data-track-index="10"></audio>
      <audio id="sfx-card" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="4.70" data-duration="0.57" data-volume="0.35" data-track-index="9"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="4.81" data-duration="2.05" data-media-start="1.5" data-volume="0.28" data-fade-in="0.3" data-fade-out="0.12" data-track-index="11"></audio>
      <audio id="sfx-card-land" class="clip" src="assets/sfx/sparkle.mp3" data-start="5.46" data-duration="0.9" data-volume="0.22" data-fade-out="0.3" data-track-index="12"></audio>
      <audio id="sfx-chip1" class="clip" src="assets/sfx/pop.mp3" data-start="5.31" data-duration="0.3" data-volume="0.45" data-track-index="9"></audio>
      <audio id="sfx-chip2" class="clip" src="assets/sfx/click-soft.mp3" data-start="5.50" data-duration="0.3" data-volume="0.5" data-track-index="10"></audio>
      <audio id="sfx-chip3" class="clip" src="assets/sfx/pop.mp3" data-start="5.57" data-duration="0.3" data-volume="0.38" data-track-index="9"></audio>
      <audio id="sfx-chip4" class="clip" src="assets/sfx/click-soft.mp3" data-start="5.76" data-duration="0.3" data-volume="0.45" data-track-index="10"></audio>
      <audio id="sfx-slam" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="6.71" data-duration="1.6" data-volume="0.42" data-fade-out="0.5" data-track-index="10"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/whoosh.mp3" data-start="7.52" data-duration="0.57" data-volume="0.4" data-track-index="9"></audio>
      <audio id="sfx-cta-pop" class="clip" src="assets/sfx/pop.mp3" data-start="8.18" data-duration="0.4" data-volume="0.5" data-track-index="9"></audio>
    </div>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const cam = "#cam";
        const shk = "#shake";

        // ---- HOOK: zoom-in steps on every "tepi" (out 0.15 / 0.49 / 0.77) ----
        tl.set(cam, { scale: 1, x: 0, y: 0, transformOrigin: "50% 45%" }, 0);
        [
          [0.15, 1.08],
          [0.49, 1.16],
          [0.77, 1.24],
        ].forEach(([t, s]) => {
          tl.to(cam, { scale: s, duration: 0.1, ease: "power4.out" }, t);
          tl.to(shk, { x: 7, y: -5, duration: 0.033, ease: "none" }, t);
          tl.to(shk, { x: -5, y: 4, duration: 0.033, ease: "none" }, t + 0.033);
          tl.to(shk, { x: 0, y: 0, duration: 0.05, ease: "power2.out" }, t + 0.066);
        });
        // zoom-out reveal as the headline wall clears
        tl.to(cam, { scale: 1, duration: 0.55, ease: "power2.inOut" }, 0.95);

        // ---- DIGITAL ZOOM on "guys": two hard stepped crops toward his face ----
        tl.set(cam, { transformOrigin: "50% 50%" }, 2.6);
        tl.to(cam, { scale: 1.3, x: -152, y: 20, duration: 0.066, ease: "steps(2)" }, 2.72);
        tl.to(cam, { scale: 1.6, x: -250, y: 47, duration: 0.066, ease: "steps(2)" }, 3.0);
        // hard punch-out on the cut into the clone wall
        tl.set(cam, { scale: 1, x: 0, y: 0 }, 3.47);

        // ---- C: punch-in on "medical card", zoom out on "banyak perubahan" ----
        tl.set(cam, { transformOrigin: "45% 30%" }, 4.77);
        tl.fromTo(cam, { scale: 1 }, { scale: 1.1, duration: 0.18, ease: "expo.out" }, 4.77);
        tl.to(cam, { scale: 1, duration: 0.45, ease: "power2.inOut" }, 5.36);

        // ---- D: slam on "2027" (out 6.75) with a three-frame landing shake ----
        tl.to(cam, { scale: 1.18, duration: 0.14, ease: "expo.out" }, 6.75);
        [
          [16, -12],
          [-12, 10],
          [8, -6],
          [-4, 3],
          [0, 0],
        ].forEach(([x, y], i) => tl.to(shk, { x, y, duration: 0.033, ease: "none" }, 6.75 + i * 0.033));
        tl.fromTo("#flash", { opacity: 0.75 }, { opacity: 0, duration: 0.18, ease: "power2.out" }, 6.75);

        // ---- E: slow-mo outro, long zoom-out under the CTA ----
        tl.to(cam, { scale: 1, duration: 1.4, ease: "power2.inOut" }, 7.66);

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
